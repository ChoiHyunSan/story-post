# Native installers used by the approved development tools.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-router@57.0.23
nodeLinker: hoisted
# Expo SDK 57 parents pin older compatible APIs; keep patched transitive versions
# until an Expo update removes the overrides. `pnpm sdk:check` verifies compatibility.
overrides:
  decode-uri-component: 0.5.0
  uuid@7.0.3: 11.1.1
